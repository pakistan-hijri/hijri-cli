name: Feature request
description: Suggest a behaviour or command
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the CLI makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the CLI do? Include example commands or output if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing tools.
  - type: dropdown
    id: target
    attributes:
      label: Is this about the data or the CLI?
      options:
        - The CLI (display, flags, onboarding, output)
        - The data (dates or prayer times themselves)
        - Not sure
    validations:
      required: true
